<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCIAL NEWS STUDIO — Hình Ảnh + Âm Thanh Đồng Bộ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --eco: #2563EB; --fin: #CA8A04; --stk: #059669; --news: #DC2626; }
        * { font-family: 'Inter', sans-serif; margin:0; padding:0; box-sizing:border-box; }
        body { background:#050c24; color:#fff; min-height:100vh; }

        .grid-world {
            background: radial-gradient(circle at top, rgba(37,99,235,0.12) 0%, transparent 55%), #050c24;
            background-image: 
                linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
            background-size: 25px 25px;
            animation: gridFlow 25s linear infinite;
        }
        @keyframes gridFlow { 0% { background-position:0 0; } 100% { background-position:25px 25px; } }

        @keyframes fadeInUp {
            0% { opacity:0; transform:translateY(40px) scale(0.95); }
            100% { opacity:1; transform:translateY(0) scale(1); }
        }
        @keyframes slideScene {
            0% { opacity:0; transform:translateY(50px); }
            10% { opacity:1; transform:translateY(0); }
            85% { opacity:1; transform:translateY(0); }
            100% { opacity:0; transform:translateY(-40px); }
        }
        @keyframes glowDot {
            0%,100% { filter:drop-shadow(0 0 6px currentColor); }
            50% { filter:drop-shadow(0 0 22px currentColor); }
        }
        .fade-in-up { animation:fadeInUp 1.2s ease-out forwards; opacity:0; }
        .scene-slide { animation:slideScene 7s ease-in-out forwards; opacity:0; }
        .glow-dot { animation:glowDot 2s ease-in-out infinite; }
        .tab-active { background:linear-gradient(135deg, #1D4ED8, #3B82F6); color:white; box-shadow:0 0 20px rgba(37,99,235,0.4); }
        .illust-card { border-radius:16px; padding:10px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.04); }
        .scene-hidden { display:none !important; }
        .scene-active { display:flex !important; }
    </style>
</head>
<body class="grid-world">
    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-2 bg-gradient-to-r from-blue-400 via-indigo-300 to-blue-500 bg-clip-text text-transparent">FINANCIAL NEWS STUDIO</h1>
            <p class="text-blue-200 text-lg">🎯 Hình ảnh chính xác theo nội dung • 🔊 Âm thanh đồng bộ • Tự động chuyển cảnh theo lời nói</p>
        </header>

        <div class="flex flex-wrap justify-center gap-3 mb-8">
            <button data-cat="economy" class="tab-btn px-6 py-3 rounded-xl font-semibold border-2 border-blue-500/40 tab-active">📊 Kinh tế</button>
            <button data-cat="finance" class="tab-btn px-6 py-3 rounded-xl font-semibold border-2 border-yellow-500/40 text-yellow-300 hover:bg-yellow-500/20">💰 Tài chính</button>
            <button data-cat="stock" class="tab-btn px-6 py-3 rounded-xl font-semibold border-2 border-emerald-500/40 text-emerald-300 hover:bg-emerald-500/20">📈 Chứng khoán</button>
            <button data-cat="news" class="tab-btn px-6 py-3 rounded-xl font-semibold border-2 border-red-500/40 text-red-300 hover:bg-red-500/20">📰 Thời sự</button>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <!-- BÊN TRÁI: NHẬP NỘI DUNG + TẢI ÂM THANH -->
            <div class="bg-slate-900/60 backdrop-blur-md rounded-2xl p-6 border border-blue-500/20">
                <h2 class="text-xl font-bold mb-4">✍️ Nội Dung & Âm Thanh</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-blue-300 font-medium mb-2">Tiêu đề chính</label>
                        <input type="text" id="titleIn" placeholder="VD: Thị trường chứng khoán tuần này" 
                            class="w-full px-4 py-3 rounded-lg bg-slate-800/80 border border-blue-500/30 focus:border-blue-400 outline-none text-lg">
                    </div>
                    <div>
                        <label class="block text-blue-300 font-medium mb-2">Nội dung lời nói (mỗi dòng = 1 cảnh)</label>
                        <textarea id="contentIn" rows="7" placeholder="VD: VN-Index tăng 6.5%&#10;Giá vàng tăng 23 USD/ounce&#10;Thanh khoản đạt 45 nghìn tỷ" 
                            class="w-full px-4 py-3 rounded-lg bg-slate-800/80 border border-blue-500/30 focus:border-blue-400 outline-none text-base leading-relaxed"></textarea>
                    </div>
                    <div>
                        <label class="block text-green-300 font-medium mb-2">🎙️ Tải file âm thanh lời nói (MP3/WAV)</label>
                        <input type="file" id="audioIn" accept="audio/*" 
                            class="w-full px-4 py-3 rounded-lg bg-slate-800/80 border border-green-500/30 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:bg-green-600 file:text-white file:border-0">
                    </div>
                    <button id="genBtn" class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 font-bold text-xl mt-2">🎬 TẠO & PHÁT: HÌNH + ÂM THANH</button>
                </div>
            </div>

            <!-- BÊN PHẢI: XEM TRƯỚC -->
            <div class="bg-slate-900/60 backdrop-blur-md rounded-2xl p-6 border border-blue-500/20">
                <h2 class="text-xl font-bold mb-4">🖼️ Hình Ảnh Minh Họa + 🔊 Âm Thanh</h2>
                <div id="previewBox" class="relative w-full aspect-video rounded-xl overflow-hidden border border-blue-500/30 bg-[#050c24]">
                    <div class="absolute top-3 left-3 z-20"><span id="catBadge" class="px-3 py-1 rounded-md bg-blue-600/80 text-white text-sm font-bold">KINH TẾ</span></div>
                    <div class="absolute top-3 right-3 z-20 text-white text-sm font-mono" id="timeShow">00:00</div>
                    <div id="sceneArea" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-lg text-blue-200/60">Nhập nội dung → Tải file lời nói → Bấm Tạo<br>✅ Hình ảnh bám sát nội dung<br>✅ Âm thanh phát + tự động chuyển cảnh</p>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 h-1.5 bg-slate-700/50 z-20">
                        <div id="progBar" class="h-full bg-green-500 transition-all duration-300" style="width:0%"></div>
                    </div>
                </div>
                <div class="mt-4 flex gap-3">
                    <button id="playBtn" class="flex-1 py-3 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-bold text-lg">▶ TIẾP TỤC</button>
                    <button id="pauseBtn" class="flex-1 py-3 rounded-lg bg-yellow-600/80 hover:bg-yellow-500 font-bold text-lg">⏸ TẠM DỪNG</button>
                    <button id="stopBtn" class="flex-1 py-3 rounded-lg bg-red-600/80 hover:bg-red-500 font-bold text-lg">⏹ DỪNG</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cat = 'economy';
        let audio = null;
        let scenes = [];
        let sceneDuration = 7; // giây mỗi cảnh
        let totalTime = 0;
        let isPlaying = false;
        let currentSceneIdx = -1;
        let syncTimer = null;

        const C = {
            economy: { label:'KINH TẾ', color:'#2563EB' },
            finance: { label:'TÀI CHÍNH', color:'#CA8A04' },
            stock: { label:'CHỨNG KHOÁN', color:'#059669' },
            news: { label:'THỜI SỰ', color:'#DC2626' }
        };

        // CHUYỂN CHUYÊN MỤC
        document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{
            document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('tab-active'));
            b.classList.add('tab-active');
            cat = b.dataset.cat;
            document.getElementById('catBadge').textContent = C[cat].label;
            document.getElementById('catBadge').style.backgroundColor = C[cat].color + 'CC';
        });

        // TRÍCH XUẤT SỐ LIỆU & ĐƠN VỊ
        function extractNumber(text) {
            const m = text.match(/[\d,.]+/); return m ? m[0] : '';
        }
        function extractUnit(text) {
            const t = text.toLowerCase();
            if(t.includes('usd') || t.includes('đô la')) return 'USD';
            if(t.includes('nghìn tỷ')) return 'NGHÌN TỶ';
            if(t.includes('tỷ')) return 'TỶ';
            if(t.includes('triệu')) return 'TRIỆU';
            if(t.includes('%')) return '%';
            if(t.includes('ounce')) return 'USD/OZ';
            return '';
        }

        // TẠO HÌNH ẢNH SVG CHÍNH XÁC THEO NỘI DUNG
        function getSVG(text, color) {
            const t = text.toLowerCase();
            const num = extractNumber(text);
            const unit = extractUnit(text);
            const label = num && unit ? `${num} ${unit}` : (num ? num : '');

            // VN-INDEX TĂNG
            if((t.includes('vn-index') || t.includes('chỉ số')) && (t.includes('tăng') || t.includes('lên'))) {
                return `<div class="illust-card fade-in-up">
                    <svg width="260" height="150" viewBox="0 0 260 150">
                        <defs><linearGradient id="up" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="${color}" stop-opacity="0.15"/>
                            <stop offset="100%" stop-color="${color}" stop-opacity="0.65"/>
                        </linearGradient></defs>
                        <text x="15" y="25" fill="${color}" font-size="14" font-weight="bold">VN-INDEX TĂNG</text>
                        <path d="M30,120 L70,90 L110,65 L150,45 L190,30 L230,45" fill="url(#up)" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="230" cy="45" r="10" fill="${color}" class="glow-dot"/>
                        <text x="130" y="145" text-anchor="middle" fill="${color}" font-size="16" font-weight="bold">${label || ''}</text>
                    </svg>
                </div>`;
            }
            // VN-INDEX GIẢM
            if((t.includes('vn-index') || t.includes('chỉ số')) && (t.includes('giảm') || t.includes('xuống'))) {
                return `<div class="illust-card fade-in-up">
                    <svg width="260" height="150" viewBox="0 0 260 150">
                        <defs><linearGradient id="dn" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="${color}" stop-opacity="0.65"/>
                            <stop offset="100%" stop-color="${color}" stop-opacity="0.15"/>
                        </linearGradient></defs>
                        <text x="15" y="25" fill="${color}" font-size="14" font-weight="bold">VN-INDEX GIẢM</text>
                        <path d="M30,30 L70,50 L110,75 L150,100 L190,115 L230,130" fill="url(#dn)" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="230" cy="130" r="10" fill="${color}" class="glow-dot"/>
                        <text x="130" y="145" text-anchor="middle" fill="${color}" font-size="16" font-weight="bold">${label || ''}</text>
                    </svg>
                </div>`;
            }
            // GIÁ VÀNG
            if(t.includes('vàng')) {
                return `<div class="illust-card fade-in-up">
                    <svg width="220" height="150" viewBox="0 0 220 150">
                        <text x="20" y="25" fill="${color}" font-size="14" font-weight="bold">GIÁ VÀNG</text>
                        <polygon points="110,35 160,65 150,125 70,125 60,65" fill="${color}" opacity="0.35" stroke="${color}" stroke-width="4"/>
                        <polygon points="110,55 140,75 135,110 85,110 80,75" fill="${color}" opacity="0.75"/>
                        <circle cx="110" cy="90" r="20" fill="#fff" opacity="0.9"/>
                        <text x="110" y="97" text-anchor="middle" fill="${color}" font-size="20" font-weight="bold" class="glow-dot">AU</text>
                        <text x="110" y="145" text-anchor="middle" fill="${color}" font-size="16" font-weight="bold">${label || ''}</text>
                    </svg>
                </div>`;
            }
            // THANH KHOẢN / GIÁ TRỊ
            if(t.includes('thanh khoản') || t.includes('giá trị') || t.includes('giao dịch')) {
                return `<div class="illust-card fade-in-up">
                    <svg width="260" height="150" viewBox="0 0 260 150">
                        <text x="15" y="25" fill="${color}" font-size="14" font-weight="bold">GIÁ TRỊ GIAO DỊCH</text>
                        <rect x="30" y="85" width="45" height="55" fill="${color}" opacity="0.25" rx="4"/>
                        <rect x="85" y="65" width="45" height="75" fill="${color}" opacity="0.45" rx="4"/>
                        <rect x="140" y="45" width="45" height="95" fill="${color}" opacity="0.7" rx="4"/>
                        <rect x="195" y="75" width="45" height="65" fill="${color}" opacity="0.35" rx="4"/>
                        <text x="130" y="145" text-anchor="middle" fill="${color}" font-size="16" font-weight="bold">${label || ''}</text>
                    </svg>
                </div>`;
            }
            // ĐẦU TƯ NƯỚC NGOÀI
            if(t.includes('nước ngoài') || t.includes('mua ròng')) {
                return `<div class="illust-card fade-in-up">
                    <svg width="260" height="150" viewBox="0 0 260 150">
                        <text x="15" y="25" fill="${color}" font-size="14" font-weight="bold">ĐẦU TƯ NƯỚC NGOÀI</text>
                        <circle cx="70" cy="85" r="30" fill="${color}" opacity="0.2" stroke="${color}" stroke-width="2"/>
                        <text x="70" y="93" text-anchor="middle" font-size="28">🌍</text>
                        <path d="M115,85 L160,85" stroke="${color}" stroke-width="4" stroke-linecap="round"/>
                        <polygon points="155,75 175,85 155,95" fill="${color}" class="glow-dot"/>
                        <rect x="185" y="55" width="55" height="60" rx="8" fill="${color}" opacity="0.35" stroke="${color}" stroke-width="2"/>
                        <text x="212" y="93" text-anchor="middle" fill="${color}" font-size="18">$$$</text>
                        <text x="130" y="145" text-anchor="middle" fill="${color}" font-size="16" font-weight="bold">${label || ''}</text>
                    </svg>
                </div>`;
            }
            // LÃI SUẤT
            if(t.includes('lãi suất')) {
                return `<div class="illust-card fade-in-up">
                    <svg width="220" height="150" viewBox="0 0 220 150">
                        <text x="20" y="25" fill="${color}" font-size="14" font-weight="bold">LÃI SUẤT</text>
                        <polygon points="110,35 200,70 200,125 20,125 20,70" fill="${color}" opacity="0.15" stroke="${color}" stroke-width="3"/>
                        <rect x="45" y="80" width="35" height="40" fill="${color}" opacity="0.8" rx="3"/>
                        <rect x="90" y="70" width="40" height="50" fill="${color}" opacity="0.95" rx="3"/>
                        <rect x="140" y="85" width="35" height="35" fill="${color}" opacity="0.6" rx="3"/>
                        <text x="110" y="60" text-anchor="middle" font-size="18">🏦</text>
                        <text x="110" y="145" text-anchor="middle" fill="${color}" font-size="16" font-weight="bold">${label || ''}</text>
                    </svg>
                </div>`;
            }
            // TỶ GIÁ
            if(t.includes('tỷ giá')) {
                return `<div class="illust-card fade-in-up">
                    <svg width="260" height="150" viewBox="0 0 260 150">
                        <text x="15" y="25" fill="${color}" font-size="14" font-weight="bold">TỶ GIÁ</text>
                        <rect x="30" y="50" width="80" height="65" rx="10" fill="${color}" opacity="0.25" stroke="${color}" stroke-width="2"/>
                        <text x="70" y="92" text-anchor="middle" fill="${color}" font-size="22" font-weight="bold">USD</text>
                        <path d="M125,82 L165,82" stroke="${color}" stroke-width="4" stroke-linecap="round"/>
                        <polygon points="160,72 180,82 160,92" fill="${color}" class="glow-dot"/>
                        <rect x="180" y="50" width="55" height="65" rx="10" fill="${color}" opacity="0.35" stroke="${color}" stroke-width="2"/>
                        <text x="207" y="92" text-anchor="middle" fill="${color}" font-size="22" font-weight="bold">VND</text>
                        <text x="130" y="145" text-anchor="middle" fill="${color}" font-size="16" font-weight="bold">${label || ''}</text>
                    </svg>
                </div>`;
            }
            // MẶC ĐỊNH
            return `<div class="illust-card fade-in-up">
                <svg width="260" height="150" viewBox="0 0 260 150">
                    <text x="15" y="25" fill="${color}" font-size="14" font-weight="bold">DỮ LIỆU THỊ TRƯỜNG</text>
                    <rect x="30" y="85" width="45" height="55" fill="${color}" opacity="0.25" rx="4"/>
                    <rect x="85" y="65" width="45" height="75" fill="${color}" opacity="0.45" rx="4"/>
                    <rect x="140" y="45" width="45" height="95" fill="${color}" opacity="0.7" rx="4"/>
                    <rect x="195" y="75" width="45" height="65" fill="${color}" opacity="0.35" rx="4"/>
                    <text x="130" y="145" text-anchor="middle" fill="${color}" font-size="16" font-weight="bold">${label || ''}</text>
                </svg>
            </div>`;
        }

        // TẠO & PHÁT
        document.getElementById('genBtn').onclick = function(){
            if(audio) { audio.pause(); audio = null; }
            clearInterval(syncTimer);
            isPlaying = false;
            currentSceneIdx = -1;

            const title = document.getElementById('titleIn').value.trim() || 'Tin tức thị trường';
            const lines = document.getElementById('contentIn').value.trim().split('\n').filter(x=>x.trim().length>0);
            const audioFile = document.getElementById('audioIn').files[0];

            if(!lines.length) return alert('Vui lòng nhập nội dung! Mỗi dòng 1 cảnh.');
            if(!audioFile) { alert('⚠️ Chưa tải file âm thanh lời nói!\nApp sẽ chỉ hiển thị hình ảnh, không có âm thanh.'); }

            // Tạo cảnh
            scenes = [];
            totalTime = lines.length * sceneDuration;
            const area = document.getElementById('sceneArea');
            area.innerHTML = '';
            const color = C[cat].color;

            lines.forEach((txt, i)=>{
                scenes.push({ text:txt, title:title, svg:getSVG(txt, color), start:i*sceneDuration, end:(i+1)*sceneDuration });
                const block = document.createElement('div');
                block.className = 'scene-hidden flex-col items-center justify-center text-center p-2 scene-slide';
                block.dataset.sceneIndex = i;
                block.style.opacity = '0';
                block.innerHTML = `
                    ${scenes[i].svg}
                    <h3 class="text-xl font-bold mt-2 mb-1">${title}</h3>
                    <div class="w-20 h-1 mx-auto mb-2 rounded-full" style="background-color:${color}"></div>
                    <p class="text-base max-w-md">${txt}</p>
                `;
                area.appendChild(block);
            });

            // Phát âm thanh & đồng bộ cảnh
            if(audioFile) {
                const url = URL.createObjectURL(audioFile);
                audio = new Audio(url);
                audio.playbackRate = 1;
                audio.play();
                isPlaying = true;
                startTimeSync();
            } else {
                // Không có âm thanh → tự chạy cảnh theo thời gian
                runSceneWithoutAudio();
            }
        };

        // ĐỒNG BỘ THEO THỜI GIAN ÂM THANH
        function startTimeSync() {
            syncTimer = setInterval(()=>{
                if(!audio) return;
                const t = audio.currentTime;
                updateTimeDisplay(t);
                updateProgress(t);
                updateScene(t);
                if(audio.ended) {
                    clearInterval(syncTimer);
                    isPlaying = false;
                    hideAllScenes();
                }
            }, 100);
        }

        // CHẠY KHI KHÔNG CÓ ÂM THANH
        function runSceneWithoutAudio() {
            let t = 0;
            syncTimer = setInterval(()=>{
                t += 0.1;
                updateTimeDisplay(t);
                updateProgress(t);
                updateScene(t);
                if(t >= totalTime) {
                    clearInterval(syncTimer);
                    isPlaying = false;
                    hideAllScenes();
                }
            }, 100);
        }

        // CẬP NHẬT CẢNH HIỆN TẠI
        function updateScene(currentTime) {
            const idx = Math.floor(currentTime / sceneDuration);
            if(idx !== currentSceneIdx && idx >=0 && idx < scenes.length) {
                currentSceneIdx = idx;
                document.querySelectorAll('[data-scene-index]').forEach((el,i)=>{
                    el.classList.remove('scene-active');
                    el.classList.add('scene-hidden');
                    if(i === idx) {
                        el.classList.remove('scene-hidden');
                        el.classList.add('scene-active');
                        el.style.animation = 'none';
                        el.offsetHeight; // kích hoạt lại animation
                        el.style.animation = '';
                    }
                });
            }
        }

        function hideAllScenes() {
            document.querySelectorAll('[data-scene-index]').forEach(el=>{
                el.classList.remove('scene-active');
                el.classList.add('scene-hidden');
            });
        }

        function updateTimeDisplay(s) {
            const m = Math.floor(s/60), sec = Math.floor(s%60);
            document.getElementById('timeShow').textContent = `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        function updateProgress(t) {
            const pct = totalTime > 0 ? (t/totalTime)*100 : 0;
            document.getElementById('progBar').style.width = Math.min(pct,100)+'%';
        }

        // NÚT ĐIỀU KHIỂN
        document.getElementById('playBtn').onclick = ()=>{ if(audio) audio.play(); };
        document.getElementById('pauseBtn').onclick = ()=>{ if(audio) audio.pause(); };
        document.getElementById('stopBtn').onclick = ()=>{
            if(audio) { audio.pause(); audio.currentTime=0; }
            clearInterval(syncTimer);
            isPlaying = false;
            currentSceneIdx = -1;
            document.getElementById('timeShow').textContent = '00:00';
            document.getElementById('progBar').style.width = '0%';
            hideAllScenes();
        };
    </script>
</body>
</html>
