<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Hình Ảnh 2D Tài Chính</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0a1628;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .box {
            background: #132238;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            background: #0f1e33;
            color: white;
            border: 1px solid #2563eb;
            margin-bottom: 15px;
            resize: vertical;
        }

        input[type="file"] {
            margin-bottom: 15px;
            color: #94a3b8;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        #khuvechinh {
            background: #0f1e33;
            padding: 30px;
            border-radius: 12px;
            min-height: 450px;
            position: relative;
            overflow: hidden;
        }

        .canh {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: hienLen 0.6s ease-out;
        }

        .canh.hien {
            display: flex;
        }

        @keyframes hienLen {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bieu-do {
            width: 100%;
            max-width: 700px;
            margin-bottom: 20px;
        }

        .tieude {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .noidung {
            font-size: 22px;
            color: #cbd5e1;
            max-width: 600px;
        }

        .thanh-tien-trinh {
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            margin-top: 20px;
        }

        .thanh-tien-trinh div {
            height: 100%;
            background: #22c55e;
            width: 0%;
            border-radius: 4px;
            transition: width 0.5s;
        }

        .dong-ho {
            position: absolute;
            top: 15px;
            right: 20px;
            font-family: monospace;
            font-size: 18px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 STUDIO HÌNH ẢNH 2D TÀI CHÍNH</h1>

    <div class="box">
        <p style="margin-bottom: 10px; color: #94a3b8;">Nhập nội dung mỗi dòng 1 cảnh:</p>
        <textarea id="noidung_vao" placeholder="VD:
VN-Index tăng 6.5%
Giá vàng thế giới tăng 23 USD/ounce
Thanh khoản đạt 45 nghìn tỷ đồng
Nhà đầu tư nước ngoài mua ròng 1200 tỷ
Lãi suất điều hành giảm 0.25 điểm phần trăm
Tỷ giá USD/VND ổn định"></textarea>

        <input type="file" id="file_amthanh" accept="audio/*">
        <br><br>

        <button onclick="BatDau()">🎬 TẠO HÌNH ẢNH 2D & PHÁT</button>
    </div>

    <div id="khuvechinh">
        <div class="dong-ho" id="dongho">00:00</div>
        <p style="text-align:center; color:#888; margin-top:150px;">Hình ảnh 2D sẽ hiện ở đây...</p>
        <div class="thanh-tien-trinh">
            <div id="prog"></div>
        </div>
    </div>
</div>

<script>
let audio = null;
let danhSachCanh = [];
let thoiGianMoiCanh = 6;
let tongThoiGian = 0;
let timer = null;
let hienTai = -1;

function layHinh2D(noidung) {
    const t = noidung.toLowerCase();

    // VN-INDEX TĂNG
    if (t.includes('vn-index') || t.includes('chỉ số')) {
        if (t.includes('tăng') || t.includes('lên') || t.includes('cao')) {
            return `
                <svg class="bieu-do" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="0" width="700" height="400" fill="#0f1e33" rx="12"/>
                    <text x="350" y="50" fill="#2563eb" font-size="28" font-weight="bold" text-anchor="middle">VN-INDEX TĂNG</text>
                    <polyline points="60,320 120,260 180,210 240,170 300,130 360,90 420,110 480,70 540,40 620,80"
                        fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="620" cy="80" r="12" fill="#22c55e"/>
                    <text x="350" y="370" fill="#94a3b8" font-size="20" text-anchor="middle">${noidung}</text>
                </svg>
            `;
        }

        if (t.includes('giảm') || t.includes('xuống') || t.includes('thấp')) {
            return `
                <svg class="bieu-do" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="0" width="700" height="400" fill="#0f1e33" rx="12"/>
                    <text x="350" y="50" fill="#dc2626" font-size="28" font-weight="bold" text-anchor="middle">VN-INDEX GIẢM</text>
                    <polyline points="60,80 120,110 180,150 240,190 300,230 360,270 420,300 480,330 540,350 620,370"
                        fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="620" cy="370" r="12" fill="#ef4444"/>
                    <text x="350" y="370" fill="#94a3b8" font-size="20" text-anchor="middle">${noidung}</text>
                </svg>
            `;
        }
    }

    // GIÁ VÀNG
    if (t.includes('vàng')) {
        return `
            <svg class="bieu-do" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="700" height="400" fill="#0f1e33" rx="12"/>
                <text x="350" y="50" fill="#eab308" font-size="28" font-weight="bold" text-anchor="middle">GIÁ VÀNG</text>
                <polygon points="350,90 470,160 440,310 260,310 230,160" fill="#eab308" opacity="0.35" stroke="#eab308" stroke-width="5"/>
                <polygon points="350,120 430,170 410,280 290,280 270,170" fill="#eab308" opacity="0.8"/>
                <circle cx="350" cy="210" r="45" fill="#ffffff" opacity="0.9"/>
                <text x="350" y="225" fill="#eab308" font-size="32" font-weight="bold" text-anchor="middle">AU</text>
                <text x="350" y="370" fill="#94a3b8" font-size="20" text-anchor="middle">${noidung}</text>
            </svg>
        `;
    }

    // THANH KHOẢN / GIÁ TRỊ GIAO DỊCH
    if (t.includes('thanh khoản') || t.includes('giá trị') || t.includes('giao dịch')) {
        return `
            <svg class="bieu-do" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="700" height="400" fill="#0f1e33" rx="12"/>
                <text x="350" y="50" fill="#f97316" font-size="28" font-weight="bold" text-anchor="middle">GIÁ TRỊ GIAO DỊCH</text>
                <rect x="80" y="230" width="100" height="120" fill="#f97316" opacity="0.25" rx="6"/>
                <rect x="220" y="180" width="100" height="170" fill="#f97316" opacity="0.45" rx="6"/>
                <rect x="360" y="130" width="100" height="220" fill="#f97316" opacity="0.7" rx="6"/>
                <rect x="500" y="200" width="100" height="150" fill="#f97316" opacity="0.35" rx="6"/>
                <text x="350" y="370" fill="#94a3b8" font-size="20" text-anchor="middle">${noidung}</text>
            </svg>
        `;
    }

    // ĐẦU TƯ NƯỚC NGOÀI
    if (t.includes('nước ngoài') || t.includes('mua ròng') || t.includes('fdi')) {
        return `
            <svg class="bieu-do" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="700" height="400" fill="#0f1e33" rx="12"/>
                <text x="350" y="50" fill="#06b6d4" font-size="28" font-weight="bold" text-anchor="middle">ĐẦU TƯ NƯỚC NGOÀI</text>
                <circle cx="180" cy="200" r="70" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="3"/>
                <path d="M180,140 Q220,110 260,140 T340,140 T420,140 T500,140" fill="none" stroke="#06b6d4" stroke-width="5"/>
                <rect x="520" y="160" width="100" height="80" fill="#06b6d4" opacity="0.35" rx="8"/>
                <text x="570" y="210" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">$$$</text>
                <text x="350" y="370" fill="#94a3b8" font-size="20" text-anchor="middle">${noidung}</text>
            </svg>
        `;
    }

    // LÃI SUẤT
    if (t.includes('lãi suất')) {
        return `
            <svg class="bieu-do" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="700" height="400" fill="#0f1e33" rx="12"/>
                <text x="350" y="50" fill="#3b82f6" font-size="28" font-weight="bold" text-anchor="middle">LÃI SUẤT</text>
                <polygon points="350,90 620,210 620,310 80,310 80,210" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="4"/>
                <rect x="150" y="220" width="90" height="70" fill="#3b82f6" opacity="0.8" rx="4"/>
                <rect x="280" y="200" width="90" height="90" fill="#3b82f6" opacity="0.95" rx="4"/>
                <rect x="410" y="230" width="90" height="60" fill="#3b82f6" opacity="0.6" rx="4"/>
                <text x="350" y="370" fill="#94a3b8" font-size="20" text-anchor="middle">${noidung}</text>
            </svg>
        `;
    }

    // TỶ GIÁ
    if (t.includes('tỷ giá')) {
        return `
            <svg class="bieu-do" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="700" height="400" fill="#0f1e33" rx="12"/>
                <text x="350" y="50" fill="#8b5cf6" font-size="28" font-weight="bold" text-anchor="middle">TỶ GIÁ</text>
                <rect x="80" y="150" width="180" height="100" rx="12" fill="#8b5cf6" opacity="0.25" stroke="#8b5cf6" stroke-width="3"/>
                <text x="170" y="215" fill="#8b5cf6" font-size="28" font-weight="bold" text-anchor="middle">USD</text>
                <path d="M310,200 L390,200" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
                <polygon points="385,190 405,200 385,210" fill="#8b5cf6"/>
                <rect x="440" y="150" width="180" height="100" rx="12" fill="#8b5cf6" opacity="0.35" stroke="#8b5cf6" stroke-width="3"/>
                <text x="530" y="215" fill="#8b5cf6" font-size="28" font-weight="bold" text-anchor="middle">VND</text>
                <text x="350" y="370" fill="#94a3b8" font-size="20" text-anchor="middle">${noidung}</text>
            </svg>
        `;
    }

    // HÌNH 2D MẶC ĐỊNH
    return `
        <svg class="bieu-do" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="700" height="400" fill="#0f1e33" rx="12"/>
            <text x="350" y="50" fill="#64748b" font-size="28" font-weight="bold" text-anchor="middle">DỮ LIỆU THỊ TRƯỜNG</text>
            <rect x="80" y="230" width="100" height="120" fill="#64748b" opacity="0.25" rx="6"/>
            <rect x="220" y="180" width="100" height="170" fill="#64748b" opacity="0.45" rx="6"/>
            <rect x="360" y="130" width="100" height="220" fill="#64748b" opacity="0.7" rx="6"/>
            <rect x="500" y="200" width="100" height="150" fill="#64748b" opacity="0.35" rx="6"/>
            <text x="350" y="370" fill="#94a3b8" font-size="20" text-anchor="middle">${noidung}</text>
        </svg>
    `;
}

function BatDau() {
    if (audio) {
        audio.pause();
        audio = null;
    }
    clearInterval(timer);
    hienTai = -1;

    const noidung = document.getElementById('noidung_vao').value;
    const dong = noidung.split('\n').filter(d => d.trim() !== '');

    if (dong.length === 0) {
        alert('Vui lòng nhập nội dung!');
        return;
    }

    const khu = document.getElementById('khuvechinh');
    khu.innerHTML = `
        <div class="dong-ho" id="dongho">00:00</div>
        <div id="canh-container"></div>
        <div class="thanh-tien-trinh"><div id="prog"></div></div>
    `;

    const container = document.getElementById('canh-container');
    danhSachCanh = [];
    tongThoiGian = dong.length * thoiGianMoiCanh;

    dong.forEach((d, i) => {
        danhSachCanh.push(d);
        const div = document.createElement('div');
        div.className = 'canh';
        div.id = 'canh_' + i;
        div.innerHTML = `
            ${layHinh2D(d)}
            <div class="tieude">${d}</div>
            <div class="noidung">Đã tạo hình ảnh 2D theo nội dung</div>
        `;
        container.appendChild(div);
    });

    const fileAmThanh = document.getElementById('file_amthanh').files[0];

    if (fileAmThanh) {
        const url = URL.createObjectURL(fileAmThanh);
        audio = new Audio(url);
        audio.play();

        timer = setInterval(() => {
            const t = audio.currentTime;
            capNhatDongHo(t);
            capNhatProg(t);
            capNhatCanh(t);

            if (audio.ended) {
                clearInterval(timer);
            }
        }, 100);
    } else {
        let t = 0;
        timer = setInterval(() => {
            t += 0.1;
            capNhatDongHo(t);
            capNhatProg(t);
            capNhatCanh(t);

            if (t >= tongThoiGian) {
                clearInterval(timer);
            }
        }, 100);
    }
}

function capNhatDongHo(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    document.getElementById('dongho').textContent =
        String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function capNhatProg(t) {
    const pct = (t / tongThoiGian) * 100;
    document.getElementById('prog').style.width = Math.min(pct, 100) + '%';
}

function capNhatCanh(t) {
    const idx = Math.floor(t / thoiGianMoiCanh);

    if (idx !== hienTai && idx >= 0 && idx < danhSachCanh.length) {
        hienTai = idx;

        for (let i = 0; i < danhSachCanh.length; i++) {
            document.getElementById('canh_' + i).classList.remove('hien');
        }

        document.getElementById('canh_' + idx).classList.add('hien');
    }
}
</script>

</body>
</html>
